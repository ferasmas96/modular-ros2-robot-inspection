# ROS parameters supplied as typed dictionaries by mapping.launch.py.
visual_odometry:
  use_sim_time: true
  frame_id: base_link
  odom_frame_id: rtabmap_odom
  publish_tf: false
  guess_frame_id: ''
  ground_truth_frame_id: ''
  wait_imu_to_init: false
  subscribe_rgbd: false
  approx_sync: false
  topic_queue_size: 10
  sync_queue_size: 10
  qos: 2
  qos_camera_info: 2
  Reg/Strategy: '0'
  Odom/ResetCountdown: '0'
mapping:
  use_sim_time: true
  frame_id: base_link
  map_frame_id: rtabmap_map
  odom_frame_id: ''
  odom_frame_id_init: ''
  publish_tf: false
  odom_sensor_sync: false
  # Native mapper falls back to odometry messages; no unavailable odom TF wait.
  wait_for_transform: 0.0
  subscribe_odom: true
  subscribe_rgb: true
  subscribe_depth: true
  subscribe_rgbd: false
  subscribe_scan: false
  subscribe_scan_cloud: false
  subscribe_scan_descriptor: false
  ground_truth_frame_id: ''
  approx_sync: false
  topic_queue_size: 10
  sync_queue_size: 10
  qos: 2
  qos_odom: 2
  qos_image: 2
  qos_camera_info: 2
  delete_db_on_start: false
  pub_loc_pose_only_when_localizing: false
  Reg/Strategy: '0'
  Mem/IncrementalMemory: 'true'
  Grid/Sensor: '1'
  # Native 32FC1 saving used PNG fallback in the observed run; select it explicitly.
  Mem/DepthCompressionFormat: '.png'
  Rtabmap/DetectionRate: '1.0'
